[project]
name = "open-djing"
version = "0.1.0"
description = "Open-source toolkit that turns Mixxx into an AI-augmented DJ learning platform"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Felipe Santos", email = "felipeaugustodosantos@gmail.com" }
]
requires-python = ">=3.12,<3.13"
keywords = ["dj", "mixxx", "music", "audio-analysis", "djing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
analysis = [
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.scripts]
odj = "open_djing.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
